<!DOCTYPE html>
<html>
<head>
  <title>My Valentine 💖</title>

  <style>
    body {
      background: #ffd1dc;
      font-family: Arial, sans-serif;
      text-align: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 360px;
      margin: 80px auto;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      position: relative;
    }

    button {
      background: hotpink;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
    }

    #noBtn {
      background: gray;
      position: absolute;
    }

    /* Love section */
    #loveSection {
      display: none;
      opacity: 0;
      transition: opacity 1.5s ease;
      margin-top: 30px;
    }

    /* Final screen */
    #finalScreen {
      display: none;
      margin-top: 30px;
    }

    img {
      width: 100px;
      border-radius: 15px;
      margin: 5px;
    }

    .note {
      background: #fff0f5;
      padding: 15px;
      border-radius: 15px;
      margin-top: 15px;
      min-height: 80px;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      font-size: 20px;
      animation: floatUp 5s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-300px); opacity: 0; }
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: red;
      top: -10px;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(100vh) rotate(360deg); }
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Will you be my Valentine shinu? 💖</h1>

    <button onclick="sayYes()">Yes 💕</button>
    <button id="noBtn" onmouseover="moveNo()">No 😐</button>

    <p id="message"></p>

    <!-- Love Section -->
    <div id="loveSection">
      <h2>For You 💌</h2>

      <img src="photo1.png">
      <img src="photo2.png">

      <div class="note" id="noteText">
        You make my ordinary days feel special 💕
      </div>

      <button onclick="nextNote()">Next Note 📖</button>
      <button onclick="showFinal()">One more thing 💖</button>
    </div>

    <!-- Final Screen -->
    <div id="finalScreen">
      <h2>Thank you for saying YES 💘</h2>
      <p>
        I’m really happy you’re my Valentine 🥹  
        This is just the beginning 💕
      </p>
    </div>

    <audio id="music">
  <source src="Raabta.mp3">
</audio>

 </div>

  <script>
    function moveNo() {
      let noBtn = document.getElementById("noBtn");
      let x = Math.random() * (window.innerWidth - 100);
      let y = Math.random() * (window.innerHeight - 50);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function sayYes() {
      document.getElementById("message").innerHTML =
        "YAY 😆💘 Best decision ever!";
      document.getElementById("music").play();

      let section = document.getElementById("loveSection");
      section.style.display = "block";
      setTimeout(() => section.style.opacity = 1, 100);

      startHearts();
    }

    function startHearts() {
      setInterval(() => {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💗";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.bottom = "0px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
      }, 500);
    }

    let notes = [
      "You make my ordinary days feel special 💕",
      "I smile every time I think of you 🥹",
      "This website is cheesy, but you’re worth it 😆💖",
      "I’m really lucky to have you 🌷"
    ];
    let noteIndex = 0;

    function nextNote() {
      noteIndex = (noteIndex + 1) % notes.length;
      document.getElementById("noteText").innerHTML = notes[noteIndex];
    }

    function showFinal() {
      document.getElementById("loveSection").style.display = "none";
      document.getElementById("finalScreen").style.display = "block";
      launchConfetti();
    }

    function launchConfetti() {
      for (let i = 0; i < 100; i++) {
        let confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random() * window.innerWidth + "px";
        confetti.style.background =
          ["#ff4d6d", "#ffd166", "#06d6a0", "#118ab2"][Math.floor(Math.random()*4)];
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
      }
    }
  </script>

</body>
</html>
